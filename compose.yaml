name: libraryku-project1
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: libraryku
      POSTGRES_USER: libraryku_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Buat file .env dari .env.example terlebih dahulu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraryku_user -d libraryku"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - app_network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: libraryku
      DB_USER: libraryku_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Buat file .env dari .env.example terlebih dahulu}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "5000"
    networks:
      - app_network

  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      # Hanya loopback Kali secara bawaan (akses publik lewat Cloudflare Tunnel yang berjalan di Kali).
      # Untuk akses LAN/NAT VirtualBox lama, isi FRONTEND_BIND=0.0.0.0 di .env (tidak disarankan: API tulis butuh login).
      - "${FRONTEND_BIND:-127.0.0.1}:8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # ---------- LibraryKu Unified: NoSQL (MongoDB), ditambahkan tanpa mengubah service SQL di atas ----------
  mongodb:
    image: mongo:7.0.45
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Tambahkan MONGO_ROOT_PASSWORD ke .env (lihat .env.example)}
      MONGO_APP_DB: libraryku_nosql
      MONGO_APP_USER: libraryku_app
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Tambahkan MONGO_APP_PASSWORD ke .env (lihat .env.example)}
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init-app-user.js:/docker-entrypoint-initdb.d/01-init-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --norc -u \"$$MONGO_APP_USER\" -p \"$$MONGO_APP_PASSWORD\" --authenticationDatabase \"$$MONGO_APP_DB\" \"$$MONGO_APP_DB\" --eval 'quit(db.runCommand({ping:1}).ok === 1 ? 0 : 1)'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 300
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nosql_network

  backend-nosql:
    build: ./backend_nosql
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: libraryku_nosql
      MONGO_APP_USER: libraryku_app
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Tambahkan MONGO_APP_PASSWORD ke .env (lihat .env.example)}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/nosql/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 150
    networks:
      - app_network
      - nosql_network

networks:
  app_network:
    driver: bridge
  # Jaringan khusus MongoDB: internal (tidak ada akses keluar/masuk dari host), hanya backend-nosql yang terhubung.
  nosql_network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  mongo_data:
