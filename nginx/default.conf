# LibraryKu Unified: Nginx (router mode + pengamanan operasi tulis untuk akses publik)
# Konteks http (file ini di-include oleh nginx.conf).

# Kunci pembatasan laju per klien: lewat Cloudflare dipakai CF-Connecting-IP, selain itu alamat langsung.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
# Hanya metode tulis yang dibatasi ketat (kunci kosong = tidak dibatasi oleh zona ini).
map $request_method $write_key {
    default "";
    POST    $client_key;
    PUT     $client_key;
    DELETE  $client_key;
    PATCH   $client_key;
}
# MODE TERBUKA (tanpa nama pengguna dan kata sandi): operasi tulis dilindungi header X-Requested-With (CSRF),
# pembatasan laju, batas ukuran badan, dan validasi di backend. Untuk MENGAKTIFKAN LOGIN lagi, ganti `off` pada
# baris `default` di bawah menjadi "LibraryKu Dashboard", pastikan nginx/auth/htpasswd ada, lalu ./scripts/ctl.sh reload-nginx.
map $request_method $auth_realm {
    default off;
    GET     off;
    HEAD    off;
}
# Penjagaan halaman Peminjaman (nama, kelas, NIM). MODE TERBUKA: tanpa login, atas keputusan pemilik proyek.
# Untuk MENGAKTIFKAN login petugas lagi, ganti `off` pada baris bertanda LOANS_AUTH menjadi "LibraryKu Petugas", pastikan
# nginx/auth/htpasswd ada (bila tidak ada, endpoint peminjaman terkunci dengan pesan 503), lalu ./scripts/ctl.sh reload-nginx.
map $request_method $loans_auth {
    default off;  # LOANS_AUTH
}
limit_req_zone $client_key zone=api_read:10m  rate=20r/s;
limit_req_zone $write_key  zone=api_write:10m rate=10r/s;
limit_req_zone $client_key zone=api_loans:1m  rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS internal Docker: nama service dicari saat permintaan, bukan saat Nginx start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- Router API ----
    # Membaca (GET/HEAD) terbuka. Menulis (POST/PUT/DELETE) wajib: (1) header X-Requested-With dari aplikasi
    # (perlindungan CSRF: header khusus memicu preflight CORS yang tidak diizinkan) dan (2) lolos pembatasan laju.
    # Login Basic Auth dimatikan (lihat map $auth_realm di atas).

    # ---- Peminjaman: data pribadi (nama, kelas, NIM) ----
    # Saat ini MODE TERBUKA (map $loans_auth di atas bernilai off): tanpa login, tetap wajib header X-Requested-With,
    # dibatasi laju, dan divalidasi backend. Bila login diaktifkan, SEMUA metode termasuk GET wajib login petugas
    # (Basic Auth, nginx/auth/htpasswd). Gagal tertutup: bila berkas htpasswd tidak ada, Nginx menolak permintaan
    # (401 tanpa login, 403 dengan login; keduanya tidak diteruskan ke backend) dan 403/500 dari Nginx dipetakan ke
    # pesan 503 yang jelas. 403 dari penjagaan CSRF memakai `return` bermuatan teks sehingga tidak ikut terpetakan.
    # Dua alamat dijaga: /api/sql/loans (dipakai frontend) dan /api/loans (alamat langsung ke backend SQL).
    location ^~ /api/sql/loans {
        set $sql_upstream http://backend:5000;
        set $csrf "";
        if ($request_method !~ ^(GET|HEAD)$) { set $csrf "w"; }
        if ($http_x_requested_with != "libraryku") { set $csrf "${csrf}x"; }
        if ($csrf = "wx") { return 403 '{"error":"Permintaan tulis harus berasal dari aplikasi LibraryKu."}'; }
        rewrite ^/api/sql/(.*)$ /api/$1 break;
        proxy_pass $sql_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=api_loans burst=10 nodelay;
        default_type application/json;
        expires -1;
        error_page 401 = @unauthorized_petugas;
        error_page 429 = @too_many;
        error_page 403 500 = @petugas_belum_diatur;
        error_page 502 503 504 = @api_down;
        auth_basic $loans_auth;
        auth_basic_user_file /etc/nginx/auth/htpasswd;
    }

    location ^~ /api/loans {
        set $legacy_upstream http://backend:5000;
        set $csrf "";
        if ($request_method !~ ^(GET|HEAD)$) { set $csrf "w"; }
        if ($http_x_requested_with != "libraryku") { set $csrf "${csrf}x"; }
        if ($csrf = "wx") { return 403 '{"error":"Permintaan tulis harus berasal dari aplikasi LibraryKu."}'; }
        proxy_pass $legacy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=api_loans burst=10 nodelay;
        default_type application/json;
        expires -1;
        error_page 401 = @unauthorized_petugas;
        error_page 429 = @too_many;
        error_page 403 500 = @petugas_belum_diatur;
        error_page 502 503 504 = @api_down;
        auth_basic $loans_auth;
        auth_basic_user_file /etc/nginx/auth/htpasswd;
    }

    location /api/sql/ {
        set $sql_upstream http://backend:5000;
        # Perlindungan CSRF dan tulis harus dievaluasi SEBELUM rewrite (rewrite ... break menghentikan set/if sesudahnya).
        set $csrf "";
        if ($request_method !~ ^(GET|HEAD)$) { set $csrf "w"; }
        if ($http_x_requested_with != "libraryku") { set $csrf "${csrf}x"; }
        if ($csrf = "wx") { return 403 '{"error":"Permintaan tulis harus berasal dari aplikasi LibraryKu."}'; }
        rewrite ^/api/sql/(.*)$ /api/$1 break;
        proxy_pass $sql_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        default_type application/json;
        expires -1;
        error_page 401 = @unauthorized;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        # Login dimatikan: $auth_realm bernilai off (lihat map di atas); ganti untuk mengaktifkannya lagi.
        auth_basic $auth_realm;
        auth_basic_user_file /etc/nginx/auth/htpasswd;
    }

    location /api/nosql/ {
        set $nosql_upstream http://backend-nosql:5000;
        # Perlindungan CSRF dan tulis harus dievaluasi SEBELUM rewrite (rewrite ... break menghentikan set/if sesudahnya).
        set $csrf "";
        if ($request_method !~ ^(GET|HEAD)$) { set $csrf "w"; }
        if ($http_x_requested_with != "libraryku") { set $csrf "${csrf}x"; }
        if ($csrf = "wx") { return 403 '{"error":"Permintaan tulis harus berasal dari aplikasi LibraryKu."}'; }
        proxy_pass $nosql_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        default_type application/json;
        expires -1;
        error_page 401 = @unauthorized;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        # Login dimatikan: $auth_realm bernilai off (lihat map di atas); ganti untuk mengaktifkannya lagi.
        auth_basic $auth_realm;
        auth_basic_user_file /etc/nginx/auth/htpasswd;
    }

    # Alamat lama (/api/health, /api/books) tetap ke backend SQL, dengan perlindungan yang sama.
    location /api/ {
        set $legacy_upstream http://backend:5000;
        # Perlindungan CSRF dan tulis harus dievaluasi SEBELUM rewrite (rewrite ... break menghentikan set/if sesudahnya).
        set $csrf "";
        if ($request_method !~ ^(GET|HEAD)$) { set $csrf "w"; }
        if ($http_x_requested_with != "libraryku") { set $csrf "${csrf}x"; }
        if ($csrf = "wx") { return 403 '{"error":"Permintaan tulis harus berasal dari aplikasi LibraryKu."}'; }
        proxy_pass $legacy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        limit_req zone=api_read burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        default_type application/json;
        expires -1;
        error_page 401 = @unauthorized;
        error_page 429 = @too_many;
        error_page 502 503 504 = @api_down;
        # Login dimatikan: $auth_realm bernilai off (lihat map di atas); ganti untuk mengaktifkannya lagi.
        auth_basic $auth_realm;
        auth_basic_user_file /etc/nginx/auth/htpasswd;
    }

    location @unauthorized {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"Perlu login untuk mengubah data. Masukkan nama pengguna dan kata sandi dashboard."}';
    }

    location @unauthorized_petugas {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"Halaman peminjaman khusus petugas. Masuk dengan nama pengguna dan kata sandi petugas."}';
    }

    location @petugas_belum_diatur {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Akses petugas belum dikonfigurasi (berkas nginx/auth/htpasswd tidak ada atau tidak terbaca). Fitur peminjaman dikunci sampai itu diatur."}';
    }

    location @too_many {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Retry-After "2" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi."}';
    }

    location @api_down {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Layanan API belum tersedia. Periksa container backend atau database."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
