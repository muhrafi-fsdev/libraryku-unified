# Override Compose untuk stack UJI SEMENTARA (proyek "libraryku-uji"). Hanya dipakai scripts/uji_peminjaman.sh.
# Volume, network, dan container memakai awalan proyek libraryku-uji_, jadi terpisah dari proyek asli (libraryku-project1).
services:
  frontend:
    ports: !override
      - "127.0.0.1:55081:80"
    volumes: !override
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UJI_AUTH_DIR:?UJI_AUTH_DIR wajib diisi}:/etc/nginx/auth:ro
  database:
    # Tanpa mount migrasi: tabel loans sengaja belum ada supaya migrasi diuji pada database yang sudah berisi buku.
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
